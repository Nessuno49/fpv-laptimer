# Lap timer hotspot: every name points to 203.0.113.1 – a public-looking address
# (official documentation range, belongs to nobody). The Pi catches everything on port 80 of this
# address and redirects it to itself (see laptimer-portal.nft).
#
# Why not 10.42.0.1 directly? Android (11 and later) treats a Wi-Fi in which Google's check address
# points to a PRIVATE address as "no internet" instead of a sign-in Wi-Fi – then
# "Sign in to network" would never appear. With a public address it works like in shops and hotels.
#
# Only applies in the hotspot, not in the home network.
# Installed as /etc/NetworkManager/dnsmasq-shared.d/laptimer.conf
address=/#/203.0.113.1
